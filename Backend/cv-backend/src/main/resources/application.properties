spring.application.name=cv-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/campusvault
spring.datasource.username=sudarsanannaluru
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# JWT (must be at least 32 characters; override with an env var in production)
app.jwt.secret=${JWT_SECRET:campusvault-dev-only-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=120

# Frontend origin allowed by CORS (Vite dev server)
app.cors.allowed-origins=http://localhost:5173

# Seeds student@campus.edu and admin@campus.edu on first run
app.seed.demo-users=true

spring.jpa.open-in-view=false

# Blockchain (local Hardhat node)
app.blockchain.rpc-url=http://127.0.0.1:8545
app.blockchain.chain-id=31337
# Move the local chain clock up to real time on start (Anvil restores an old clock from its state file).
app.blockchain.sync-dev-clock=true

# Hardhat's public test account #0. Never use this key on a real network.
app.blockchain.private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80
app.blockchain.deposit-tokens=1000

# Addresses printed by deploy.js (CampusVault) and deploy-lostfound.js (LostFound).
# These are what the two scripts print when run in README order on the saved anvil-state.json;
# if yours differ, paste the printed ones here.
app.blockchain.contract-address=0x59b670e9fA9D0A427751Af201D676719a970857b
app.blockchain.lostfound-address=0xc6e7DF5E7b4f2A278906862b61205850344D4e7d
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Image matching service (the Python app in /AI)
app.ai.url=http://127.0.0.1:8000
# Photo similarity (cosine, 0 to 1) a candidate needs to be suggested.
# Calibrated with AI/calibrate_threshold.py: at 0.60, 58% of unrelated photos from
# different categories were suggested; at 0.80, none were.
app.ai.min-score=0.70
# A candidate from a different category must look much more alike to be shown.
app.ai.cross-category-min-score=0.80
# Labels shown to the user.
app.ai.strong-score=0.88
app.ai.likely-score=0.80

# Loans: how often (ms) to record newly overdue loans on the blockchain.
app.loans.overdue-check-ms=60000
# Security lab (admin): runs the injected access-control attack against throwaway copies of the
# contracts, deployed and attacked with two of Anvil's public development accounts (#2 and #1).
# Only runs when chain-id is 31337. Never put real keys here.
app.security-demo.enabled=true
app.security-demo.operator-key=0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a
app.security-demo.attacker-key=0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d
