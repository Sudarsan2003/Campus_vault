# SECURITY EXPERIMENT ONLY: the "attack environment".
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=attack
# Runs the app against CampusVaultVulnerable (returnAsset has no onlyOperator) with its own database,
# so two real accounts can lend and borrow, and the borrower can attack from their own wallet.
# Contract addresses come from attack-env.properties, written by Blockchain/scripts/deploy-attack-env.js.
spring.datasource.url=jdbc:postgresql://localhost:5432/campusvault_attack
app.upload.dir=uploads-attack
spring.jpa.show-sql=false
spring.config.import=file:./attack-env.properties
